<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提分案例库 · 华北交付中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1117;
    --ink-light: #3a3f4b;
    --ink-muted: #7a8093;
    --gold: #c89a3b;
    --gold-light: #e8c06a;
    --gold-pale: #fdf6e3;
    --bg: #f8f5f0;
    --white: #ffffff;
    --card-bg: #ffffff;
    --border: #e8e0d4;
    --shadow: 0 4px 24px rgba(14,17,23,0.08);
    --shadow-hover: 0 14px 44px rgba(14,17,23,0.18);
    --math: #c89a3b;
    --physics: #4a7c9e;
    --chemistry: #8e6bb5;
    --multi: #b5654a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    background: var(--ink);
    color: var(--white);
    padding: 64px 24px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,154,59,0.20) 0%, transparent 70%);
  }
  .hero::after {
    content: '喜报';
    position: absolute;
    right: -30px;
    bottom: -70px;
    font-family: 'Noto Serif SC', serif;
    font-size: 300px;
    font-weight: 900;
    color: rgba(255,255,255,0.03);
    pointer-events: none;
    line-height: 1;
  }
  .hero-inner { position: relative; max-width: 1120px; margin: 0 auto; }
  .back-link {
    position: absolute;
    left: 0;
    top: 2px;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: color .2s;
  }
  .back-link:hover { color: var(--gold-light); }
  .hero-org {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.75);
    margin-bottom: 18px;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(200,154,59,0.15);
    border: 1px solid rgba(200,154,59,0.4);
    color: var(--gold-light);
    font-size: 12px;
    letter-spacing: 3px;
    padding: 6px 18px;
    border-radius: 2px;
    margin-bottom: 24px;
    font-weight: 500;
  }
  .hero h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(34px, 4.6vw, 52px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 18px;
  }
  .hero h1 em { font-style: normal; color: var(--gold-light); }
  .hero p {
    color: rgba(255,255,255,0.58);
    font-size: 15px;
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.8;
    font-weight: 300;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(248,245,240,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .toolbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 14px 24px;
    align-items: center;
  }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-label {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .pill {
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--ink-light);
    font-family: inherit;
    font-size: 13px;
    padding: 5px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .pill:hover { border-color: var(--gold); color: var(--gold); }
  .pill.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--gold-light);
  }
  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .search-box {
    border: 1px solid var(--border);
    background: var(--white);
    border-radius: 999px;
    padding: 7px 15px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    width: 190px;
    outline: none;
    transition: border-color .18s;
  }
  .search-box:focus { border-color: var(--gold); }
  .search-box::placeholder { color: var(--ink-muted); }
  .sort-select {
    border: 1px solid var(--border);
    background: var(--white);
    border-radius: 999px;
    padding: 7px 13px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-light);
    cursor: pointer;
    outline: none;
  }
  .sort-select:focus { border-color: var(--gold); }

  /* ── RESULT META ── */
  .result-meta {
    max-width: 1120px;
    margin: 0 auto;
    padding: 22px 24px 8px;
    font-size: 13px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-meta strong { color: var(--gold); font-weight: 700; }

  /* ── GRID (masonry) ── */
  .grid {
    max-width: 1120px;
    margin: 0 auto;
    padding: 12px 24px 56px;
    column-count: 5;
    column-gap: 16px;
  }
  .case-card {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: zoom-in;
    position: relative;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .case-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: var(--gold);
  }
  .case-card .thumb {
    display: block;
    width: 100%;
    height: auto;
    background: var(--gold-pale);
  }
  .case-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 3px;
    color: #fff;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .case-zoom {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(14,17,23,0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    backdrop-filter: blur(4px);
  }
  .case-card:hover .case-zoom { opacity: 1; }
  .case-body { padding: 12px 13px 14px; }
  .case-gain {
    font-family: 'Noto Serif SC', serif;
    font-size: 21px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1.1;
    margin-bottom: 5px;
  }
  .case-gain small { font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-left: 4px; }
  .case-student {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .case-sub {
    font-size: 11.5px;
    color: var(--ink-muted);
    line-height: 1.5;
  }
  .case-note {
    font-size: 11.5px;
    color: var(--ink-light);
    line-height: 1.5;
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px dashed var(--border);
  }

  .empty-state {
    max-width: 1120px;
    margin: 0 auto;
    padding: 60px 24px 90px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
    display: none;
  }

  /* ── FOOTER ── */
  footer {
    background: var(--ink);
    color: rgba(255,255,255,0.4);
    text-align: center;
    padding: 32px 24px;
    font-size: 12px;
    letter-spacing: 1px;
    line-height: 1.9;
  }
  footer a { color: rgba(255,255,255,0.55); text-decoration: none; margin: 0 8px; transition: color .2s; }
  footer a:hover { color: var(--gold-light); }

  /* ── LIGHTBOX ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(8,10,14,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
    backdrop-filter: blur(6px);
  }
  .lightbox.open { display: flex; }
  .lb-stage {
    display: flex;
    gap: 28px;
    max-width: 1180px;
    width: 100%;
    max-height: 100%;
    align-items: center;
    justify-content: center;
  }
  .lb-figure {
    flex: 0 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    max-height: calc(100vh - 64px);
  }
  .lb-img {
    max-height: calc(100vh - 64px);
    max-width: 100%;
    width: auto;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    background: #16181d;
  }
  .lb-panel {
    flex: 0 0 292px;
    color: rgba(255,255,255,0.85);
    align-self: center;
  }
  .lb-panel h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px;
    font-weight: 900;
    color: var(--gold-light);
    margin-bottom: 6px;
    line-height: 1.25;
  }
  .lb-panel .lb-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 3px;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    margin-bottom: 20px;
  }
  .lb-rows { border-top: 1px solid rgba(255,255,255,0.12); }
  .lb-row {
    display: flex;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    font-size: 13.5px;
  }
  .lb-row .k { color: rgba(255,255,255,0.42); flex: 0 0 62px; letter-spacing: 1px; }
  .lb-row .v { color: #fff; font-weight: 500; }
  .lb-note {
    margin-top: 16px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.55);
    line-height: 1.7;
  }
  .lb-actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
  .lb-btn {
    font-family: inherit;
    font-size: 12.5px;
    padding: 8px 16px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.22);
    background: transparent;
    color: rgba(255,255,255,0.85);
    cursor: pointer;
    text-decoration: none;
    transition: all .18s;
  }
  .lb-btn:hover { border-color: var(--gold); color: var(--gold-light); }
  .lb-close {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: all .18s;
  }
  .lb-close:hover { border-color: var(--gold); color: var(--gold-light); }
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: all .18s;
  }
  .lb-nav:hover { background: rgba(200,154,59,0.25); border-color: var(--gold); }
  .lb-prev { left: 22px; }
  .lb-next { right: 22px; }
  .lb-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 1080px) { .grid { column-count: 4; } }
  @media (max-width: 860px) {
    .grid { column-count: 3; }
    .lb-stage { flex-direction: column; gap: 18px; overflow-y: auto; }
    .lb-panel { flex: 0 0 auto; width: 100%; max-width: 460px; }
    .lb-img { max-height: 58vh; }
    .toolbar-right { margin-left: 0; width: 100%; }
    .search-box { flex: 1; width: auto; }
  }
  @media (max-width: 620px) {
    .hero { padding: 48px 20px 40px; }
    .grid { column-count: 2; padding: 12px 16px 40px; }
    .toolbar { padding: 12px 16px; }
    .result-meta { padding: 18px 16px 6px; }
    .lb-nav { display: none; }
    .lightbox { padding: 16px; }
    .back-link { position: static; display: inline-block; margin-bottom: 16px; }
  }
</style>
</head>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="案例详情">

      </div>
    </div>
  </div>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
/* ── 案例数据 ─────────────────────────────────────────────
   来源：飞书《2026年中高考提分案例》审核库（经 OCR 校核）
   file  : cases/thumbs|full 下的文件名（不含扩展名）
   gain  : 用于排序的数值提分（无绝对分值的记为 null）
   ──────────────────────────────────────────────────────── */
const CASES = [
  { file:'case-01', exam:'高考',     subject:'数学',   student:'广东深圳 黄同学',   gain:25,   gainText:'+25分',      duration:'20课时',   team:'董逸菲团队', coach:'付其文',      note:'今年高考数学难度较大，仍考出 115 分' },
  { file:'case-02', exam:'中考',     subject:'数学',   student:'山西运城 杨同学',   gain:10,   gainText:'+10分',      duration:'一个月',   team:'董逸菲团队', coach:'张文婧',      note:'中考数学 106 分' },
  { file:'case-03', exam:'提分喜报', subject:'数学',   student:'广东深圳 张同学',   gain:15,   gainText:'+15分',      duration:'一个月',   team:'董逸菲团队', coach:'张文婧',      note:'综合测试卷 54 分，较期末 39 分提升 15 分' },
  { file:'case-04', exam:'提分喜报', subject:'物理',   student:'黑龙江 张同学',     gain:40,   gainText:'+40分',      duration:'一个月',   team:'董逸菲团队', coach:'王超俊',      note:'阶段测试 70 分，摩擦力、实验题表现突出' },
  { file:'case-05', exam:'进步喜报', subject:'数学',   student:'广东汕头 叶同学',   gain:null, gainText:'正确率+65%',  duration:'8课时',    team:'董逸菲团队', coach:'江慧敏',      note:'零基础起步，测试正确率达 85%' },
  { file:'case-06', exam:'中考',     subject:'物理',   student:'山西太原 一同学',   gain:16,   gainText:'+16分',      duration:'9小时',    team:'胡芷漪团队', coach:'周欣冉',      note:'一个月内从 57 分提升到 73 分' },
  { file:'case-07', exam:'中考',     subject:'物理',   student:'北京丰台 陈同学',   gain:10,   gainText:'+10多分',    duration:'5课时',    team:'董逸菲团队', coach:'黄龙彪',      note:'仅上 5 次课，测试 69/80' },
  { file:'case-08', exam:'中考',     subject:'数学',   student:'北京 娇同学',       gain:10,   gainText:'+10分',      duration:'8课时',    team:'董逸菲团队', coach:'张文婧',      note:'中考冲刺阶段各科均超出预期' },
  { file:'case-09', exam:'提分喜报', subject:'数学',   student:'北京 宝同学',       gain:18,   gainText:'+18分',      duration:'8课时',    team:'董逸菲团队', coach:'温雅然',      note:'高二数学总分 85/120，得分率 70.8%' },
  { file:'case-10', exam:'提分喜报', subject:'化学',   student:'聊城 陈同学',       gain:10,   gainText:'+10分',      duration:'10课时',   team:'董逸菲团队', coach:'李婷',        note:'中考化学冲刺，成绩稳步提升' },
  { file:'case-11', exam:'进步喜报', subject:'物理',   student:'北京 孟同学',       gain:null, gainText:'进步十名',    duration:'2课时',    team:'董逸菲团队', coach:'黄龙彪',      note:'仅 2 课时，整体排名进步十名' },
  { file:'case-12', exam:'中考',     subject:'物理',   student:'山西运城 卫同学',   gain:16,   gainText:'+16分',      duration:'6小时',    team:'胡芷漪团队', coach:'周欣冉',      note:'较入班时提升 16 分' },
  { file:'case-13', exam:'中考',     subject:'数理化', student:'江西 张同学',       gain:83.5, gainText:'+83.5分',    duration:'一个月',   team:'董逸菲团队', coach:'黄舒航',      note:'化学、物理、数学三科累计提升 83.5 分' },

  { file:'case-25', exam:'提分喜报', subject:'物理',   student:'北京朝阳 王同学',   gain:12,   gainText:'+12分',      duration:'两周',     team:'董逸菲团队', coach:'黄龙彪',      note:'两周内从 52 分提升到 64 分' },
  { file:'case-26', exam:'提分喜报', subject:'数学',   student:'北京 L同学',        gain:5,    gainText:'+5分',       duration:'10课时',   team:'董逸菲团队', coach:'马文博',      note:'期中模拟 86 分，班级平均 77.29 分' },
  { file:'case-27-detail', exam:'中考', subject:'化学', student:'黑龙江 毕*翼同学', gain:33, gainText:'+33分', duration:'33.5小时', team:'邹雪梅团队', coach:'谢帅', note:'化学从 26 分提升至 59 分，单科逆袭' }
];

const SUBJECT_COLORS = {
  '数学':   'var(--math)',
  '物理':   'var(--physics)',
  '化学':   'var(--chemistry)',
  '数理化': 'var(--multi)'
};

const state = { exam:'全部', subject:'全部', team:'全部', q:'', sort:'default' };

const $ = id => document.getElementById(id);

/* ── 初始化筛选项 ── */
function uniq(key) {
  return [...new Set(CASES.map(c => c[key]))];
}
function buildPills(filterKey, group) {
  uniq(filterKey).forEach(v => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.dataset.filter = filterKey;
    b.dataset.value = v;
    b.textContent = v;
    group.appendChild(b);
  });
}
const filterGroups = document.querySelectorAll('.toolbar-inner .filter-group');
buildPills('exam', filterGroups[0]);
buildPills('subject', filterGroups[1]);
buildPills('team', filterGroups[2]);

/* ── 过滤 + 排序 ── */
function visibleCases() {
  const q = state.q.trim().toLowerCase();
  let list = CASES.filter(c =>
    (state.exam === '全部' || c.exam === state.exam) &&
    (state.subject === '全部' || c.subject === state.subject) &&
    (state.team === '全部' || c.team === state.team) &&
    (!q || [c.student, c.coach, c.team, c.subject, c.exam, c.duration, c.note]
      .join(' ').toLowerCase().includes(q))
  );
  if (state.sort === 'gain-desc') {
    list = [...list].sort((a, b) => (b.gain ?? -1) - (a.gain ?? -1));
  } else if (state.sort === 'gain-asc') {
    list = [...list].sort((a, b) => (a.gain ?? 1e9) - (b.gain ?? 1e9));
  }
  return list;
}

function render() {
  const list = visibleCases();
  const grid = $('grid');
  grid.innerHTML = list.map(c => `
    <article class="case-card" data-file="${c.file}" tabindex="0" role="button"
             aria-label="${c.student} ${c.gainText} 案例详情">
      <img class="thumb" src="cases/thumbs/${c.file}.webp"
           alt="${c.exam} · ${c.subject} · ${c.student} ${c.gainText}"
           loading="lazy" decoding="async">
      <span class="case-badge" style="background:${SUBJECT_COLORS[c.subject] || 'var(--gold)'}">${c.subject}</span>
      <span class="case-zoom">⤢</span>
      <div class="case-body">
        <div class="case-gain">${c.gainText}<small>${c.duration}</small></div>
        <div class="case-student">${c.student}</div>
        <div class="case-sub">${c.exam} · ${c.team} · ${c.coach}教练</div>
        ${c.note ? `<div class="case-note">${c.note}</div>` : ''}
      </div>
    </article>`).join('');

  $('emptyState').style.display = list.length ? 'none' : 'block';
  const active = [state.exam, state.subject, state.team].filter(v => v !== '全部');
  $('resultMeta').innerHTML =
    `共 <strong>${list.length}</strong> 个案例` +
    (active.length ? ` · 筛选：${active.join(' / ')}` : '') +
    (state.q ? ` · 关键词「${state.q}」` : '');
}

/* ── 交互：筛选 ── */
document.querySelector('.toolbar-inner').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  const key = pill.dataset.filter;
  state[key] = pill.dataset.value;
  document.querySelectorAll(`.pill[data-filter="${key}"]`)
    .forEach(p => p.classList.toggle('active', p === pill));
  render();
});
$('searchBox').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sortSelect').addEventListener('change', e => { state.sort = e.target.value; render(); });

/* ── 灯箱 ── */
let current = [];
let index = 0;

function openLightbox(file) {
  current = visibleCases();
  index = Math.max(0, current.findIndex(c => c.file === file));
  paintLightbox();
  $('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  $('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function step(delta) {
  if (!current.length) return;
  index = (index + delta + current.length) % current.length;
  paintLightbox();
}
function paintLightbox() {
  const c = current[index];
  if (!c) return;
  $('lbImg').src = `cases/full/${c.file}.webp`;
  $('lbImg').alt = `${c.exam} · ${c.subject} · ${c.student}`;
  $('lbTitle').textContent = c.gainText;
  $('lbTag').textContent = `${c.exam} · ${c.subject}`;
  $('lbTag').style.background = SUBJECT_COLORS[c.subject] || 'var(--gold)';
  $('lbTag').style.color = '#fff';
  $('lbRows').innerHTML = [
    ['学员', c.student],
    ['提分', c.gainText],
    ['周期', c.duration],
    ['团队', c.team],
    ['教练', c.coach + '教练']
  ].map(([k, v]) => `<div class="lb-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  $('lbNote').textContent = c.note || '';
  $('lbDownload').href = `cases/${c.file}.png`;
  $('lbDownload').setAttribute('download', `${c.file}.png`);
  $('lbCounter').textContent = `${index + 1} / ${current.length}`;
}

$('grid').addEventListener('click', e => {
  const card = e.target.closest('.case-card');
  if (card) openLightbox(card.dataset.file);
});
$('grid').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.case-card');
  if (card) { e.preventDefault(); openLightbox(card.dataset.file); }
});
$('lbClose').addEventListener('click', closeLightbox);
$('lbPrev').addEventListener('click', () => step(-1));
$('lbNext').addEventListener('click', () => step(1));
$('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!$('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* ── 启动 ── */
render();
</script>
